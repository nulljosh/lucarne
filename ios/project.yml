name: Nook
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "202609061200"
targets:
  Nook:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.nook
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Nook.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Nook-macOS.entitlements
  NookTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
    dependencies:
      - target: Nook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.nook.tests
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Nook.app/Contents/MacOS/Nook
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: QMM486NPYC
schemes:
  Nook:
    build:
      targets:
        Nook: all
        NookTests: [test]
    test:
      targets:
        - NookTests
    run:
      config: Debug
    archive:
      config: Release
    shared: true
